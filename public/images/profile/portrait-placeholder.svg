<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100" role="img" aria-labelledby="title desc">
  <title id="title">Professional portrait placeholder</title>
  <desc id="desc">Abstract placeholder indicating where a professional portrait of Dr. Giju Paul should be placed.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#102033"/>
      <stop offset="1" stop-color="#0A1424"/>
    </linearGradient>
    <radialGradient id="glow">
